#cloud-config
# vim: syntax=yaml

# Assure this file is a correct cloud init with
#   cloud-init schema -c thisfile.yml

# Yaml check this file with
#   yamllint  thisfile.yml

# For detailed info on modules:
# http://cloudinit.readthedocs.io/en/latest/topics/modules.html

# use keywork MY_HOSTNAME (will be replaced by my script)

hostname: my_hostname
manage_etc_hosts: true
# disable root ssh
disable_root: true
fqdn: my_hostname.my_domain
timezone: Europe/Rome
ssh_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFa9Rib5xmP+bAd+JC5zM1EK5RsAtYk6cYX+h++UUdj3 dante-ed25519@laptop
chpasswd:
  expire: false

mounts:
  - ['LABEL=docker', '/var/lib/docker']
  - ['LABEL=containerd', '/var/lib/containerd']

# mount_default_fields
# These values are used to fill in any entries in 'mounts' that are not
# complete.  This must be an array, and must have 7 fields.
mount_default_fields: [None, None, "auto", "defaults,nofail", "0", "2"]

# Address disks by their STABLE scsi-slot by-id path, NOT /dev/sdX: the kernel
# does not preserve scsi-slot -> sdX order (scsi2 can enumerate as sdb), which
# would stamp the labels on the wrong-sized disks. Mount is BY LABEL on top.
disk_setup:
  /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1:
    table_type: gpt
    layout: true
    overwrite: true
  /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi2:
    table_type: gpt
    layout: true
    overwrite: true

# setup the file system on the device
fs_setup:
  - label: docker
    filesystem: ext4
    device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
    partition: auto
    overwrite: true
  - label: containerd
    filesystem: ext4
    device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi2
    partition: auto
    overwrite: true

# apt_pipelining (configure Acquire::http::Pipeline-Depth)
# Default: disables HTTP pipelining. Certain web servers, such
# as S3 do not pipeline properly (LP: #948461).
apt_pipelining: false

# Add apt resources
apt:
  sources:
    docker:
      source: "deb [arch=amd64] https://download.docker.com/linux/ubuntu resolute stable"
      keyid: "9DC858229FC7DD38854AE2D88D81803C0EBFCD88"
    youtube-downloader:
      # https://github.com/yt-dlp/yt-dlp/wiki/Installation
      source: "ppa:tomtomtom/yt-dlp"
      keyid: "CEC312CC5ED8215A6E0EFC49B90E9186F0E836FB"

# Upgrade the instance on first boot
package_upgrade: true
package_update: true
package_reboot_if_required: true

# Install the following packages
# (keep alphabetical order)
packages:
  - aptitude
  - apt-utils
  - bash-completion
  # bind9-dnsutils replaces dnsutils (transitional package gone in Ubuntu 26.04)
  - bind9-dnsutils
  - btop
  - byobu
  - bzip2
  - ca-certificates
  - cifs-utils
  - colordiff
  - cron
  # ctop removed: not in Ubuntu 26.04 archives anymore
  - curl
  - [docker-ce, 5:29.6.2-1~ubuntu.26.04~resolute]
  - [docker-ce-cli, 5:29.6.2-1~ubuntu.26.04~resolute]
  - [docker-ce-rootless-extras, 5:29.6.2-1~ubuntu.26.04~resolute]
  - figlet
  - git
  - htop
  - httpie
  - iftop
  - iotop
  - jq
  - keepalived
  - lsb-release
  - mc
  # mlocate & neofetch removed: not in Ubuntu 26.04 archives anymore (plocate covers mlocate)
  - ncdu
  - net-tools
  - nfs-common
  - nmap
  - plocate
  - pwgen
  - qemu-guest-agent
  - rsync
  - screen
  - sysfsutils
  - speedtest-cli
  - software-properties-common
  - tar
  - tree
  - unattended-upgrades
  - unzip
  - vim
  - wget
  - whois
  - yamllint
  - yt-dlp
  - zip

groups:
  - users

users:
  - default
  - name: remote
    # generated with: mkpasswd --method=SHA-512 --rounds=4096
    passwd: $6$rounds=4096$8mprvMT/jbOzH.bh$YWArz.2Uk1jX7dSiI0RlqfL8Arc4vcypL3wBWb7ePazGfEKBhzC9YIdAF8NP90dC7GkdjUly9b5UEDbEHvhrx.
    shell: /bin/bash
    primary_group: users
    # do not prevents the user from changing their password
    lock_passwd: false
  - name: dante
    gecos: Dante
    primary_group: users
    groups: admin, docker
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFa9Rib5xmP+bAd+JC5zM1EK5RsAtYk6cYX+h++UUdj3 dante-ed25519@laptop

runcmd:
  - mkdir -p /srv
  - chgrp users /srv
  - chmod 02775 /srv
  # requisiti redis, mongo, etc...
  - sysctl vm.overcommit_memory=1
  - echo 'vm.overcommit_memory = 1' >>  /etc/sysctl.conf
  - sysctl -w net.core.somaxconn=65535
  - echo 'net.core.somaxconn = 65535' >>  /etc/sysctl.conf
  - sysctl -w vm.swappiness=10
  - echo 'vm.swappiness=10' >>  /etc/sysctl.conf
  - echo never > /sys/kernel/mm/transparent_hugepage/enabled
  # il seguente necessita di pacchetto sysfsutils
  - echo 'kernel/mm/transparent_hugepage/enabled = never' >> /etc/sysfs.conf
  # requisito elasticsearch
  - echo 'vm.max_map_count = 262144' >>  /etc/sysctl.conf
  - sysctl -w vm.max_map_count=262144
  - systemctl restart qemu-guest-agent
  - apt purge -y  popularity-contest
  - apt -y autoremove
  # remove Ubuntu trash
  - sed -i 's/^ENABLED=.*/ENABLED=0/' /etc/default/motd-news
  # remove snapd trash
  - snap remove lxd
  - snap remove core26
  - snap remove core24
  - snap remove core20
  - snap remove snapd
  - systemctl stop snapd.service
  - systemctl stop snapd.socket
  - systemctl stop snapd.seeded.service
  - systemctl disable snapd.service
  - systemctl disable snapd.socket
  - systemctl disable snapd.seeded.service
  - systemctl stop snapd.service
  - systemctl stop snapd.socket
  - systemctl stop snapd.seeded.service
  - rm -rf /var/cache/snapd/
  - apt autoremove --purge snapd -y
  - rm -rf /root/snap
  # remove apport trash
  - systemctl stop apport
  - sed -i 's/^enabled=.*/enabled=0/' /etc/default/apport
  - systemctl disable apport.service
  - systemctl mask apport.service
  - rm -rf /etc/cron.daily/apport
  - rm -rf /var/crash/*
  # disable updatedb from scanning /var/lib/docker and /var/lib/containerd
  - sed -i 's/PRUNEPATHS="/&\/var\/lib\/docker \/var\/lib\/containerd /' /etc/updatedb.conf
  # to avoid perl errors on locale
  - locale-gen "en_US.UTF-8"
  - update-alternatives --set editor /usr/bin/vim.basic
  # Hetzner CIFS storagebox
  # - apt install linux-modules-extra-$(uname -r) -y
  # NFS /srv: appended here (AFTER nfs-common is installed) and not in write_files,
  # else cloud-init's early `mount -a` in the mounts module fails (no mount.nfs yet)
  - echo 'NFS_SERVER_IP:/var/nfs-share  /srv nfs nconnect=4,defaults,_netdev  0 0' >> /etc/fstab
  - mount -a
  # for keepalived
  - modprobe ip_vs
  - systemctl restart systemd-journald.service
  # more
  - ln -s /srv/bin/deploy /usr/local/bin/deploy
  - curl -o /usr/local/bin/docker-stack-ps https://gitlab.com/opencity-labs/swarm-utils/-/raw/main/docker-stack-ps && chmod +x /usr/local/bin/docker-stack-ps
  - curl -o /usr/local/bin/today-filter-docker-ps https://gitlab.com/opencity-labs/swarm-utils/-/raw/main/today-filter-docker-ps && chmod +x /usr/local/bin/today-filter-docker-ps
  - wget https://gitlab.com/opencity-labs/provisioning/-/raw/main/cloud-init-scripts/vimrc.local_for_managers -O /etc/vim/vimrc.local
  # install vim plugin manager and plugins
  - mkdir /root/cancellami
  - wget https://gitlab.com/opencity-labs/provisioning/-/raw/main/cloud-init-scripts/vim_plugins/add_vim_plugins.sh -O /root/cancellami/add_vim_plugins.sh && bash /root/cancellami/add_vim_plugins.sh
  # configurazioni yamllint
  - wget https://gitlab.com/opencity-labs/provisioning/-/raw/main/cloud-init-scripts/yamllint/yamllint.yaml -O /etc/default/yamllint.yaml
  - echo "cd /srv/stack" >> /home/dante/.bashrc
  # stick to specified versions of docker
  - apt-mark hold docker-ce docker-ce-cli docker-ce-rootless-extras
  # keepalived: config is already in place (write_files), join the VIP election
  - systemctl enable --now keepalived
# Write arbitrary files on filesystem
write_files:
  # Make containerd/docker wait for their dedicated disks (mounted by LABEL with
  # nofail). Prevents a reboot from starting them before the disk is mounted.
  - content: |
      [Unit]
      RequiresMountsFor=/var/lib/containerd
    path: /etc/systemd/system/containerd.service.d/10-require-mount.conf
  - content: |
      [Unit]
      RequiresMountsFor=/var/lib/docker
    path: /etc/systemd/system/docker.service.d/10-require-mount.conf
  - content: |
      alias ll='ls -la'
      alias cd..='cd ..'
      alias vi=vim
      alias svi='sudo vi'
      alias vis='vim "+set si"'

      alias rm='rm -i'
      alias mv='mv -i'
      alias cp='cp -i'

      alias sha1='openssl sha1'
      alias grep='grep --color=auto'
      alias pwgen='pwgen --no-vowels --numerals --capitalize --ambiguous --secure'
      alias free='\free -mht'
      alias sudo='\sudo '
      alias dmesg='\dmesg --color=auto --reltime --human --nopager --decode'
    path: /etc/profile.d/bash-aliases.sh
    permissions: '0644'
  - content: |
      set modeline
      set tabstop=4
      set shiftwidth=4
      filetype plugin indent off
      filetype plugin off
      syntax on
      " replace TAB with spaces before saving
      autocmd FileType yaml setlocal ts=2 sts=2 sw=2 expandtab fileencoding=utf-8
      autocmd FileType bash setlocal ts=2 sts=2 sw=2 expandtab fileencoding=utf-8
      autocmd FileType json setlocal ts=2 sts=2 sw=2 expandtab fileencoding=utf-8
      " remove trailing spaces before saving
      autocmd BufWritePre * :%s/\s\+$//e
    path: /etc/vim/vimrc.local
  - content: |
      ---
      # see `man yamllint`
      # relax some rules
      extends: default
      rules:
        line-length: disable
    path: /etc/default/yamllint.yaml
  - content: |
      # yamllint conf file
      YAMLLINT_CONFIG_FILE=/etc/default/yamllint.yaml
    path: /etc/environment
    append: true
  - content: |
      #!/bin/sh
      # periodically cleanup of images not used
      /usr/bin/docker system prune --force --all
    path: /etc/cron.daily/docker-cleanup
    permissions: '0755'
  - content: |
      username=SMB_USERNAME
      password=SMB_PASSWORD
    path: /etc/smb-credentials.txt
    permissions: '0600'
  #- content: |
  #    #!/bin/sh
  #    # assure we have the proper linux-modules-extra installed
  #    # even after the upgrade of the kernel
  #    apt update
  #    apt install linux-modules-extra-$(uname -r) -y
  #  path: /var/lib/cloud/scripts/per-boot/install_linux-modules-extra.sh
  #  permissions: '0700'
  - content: |
      # https://geek-cookbook.funkypenguin.co.nz/docker-swarm/keepalived/
      modprobe ip_vs
    path: /etc/modules
    append: true
  - content: |
      # TEMPORARY bridge for mixed-engine swarms (27.x managers + 29.x nodes):
      # docker 27.5.1 managers do not present ALPN in their TLS handshake and
      # grpc-go >= 1.67 (vendored in docker 29) enforces it, so `swarm join`
      # fails with "missing selected ALPN property".
      # REMOVE this drop-in once every node in the swarm runs docker >= 29.
      [Service]
      Environment=GRPC_ENFORCE_ALPN_ENABLED=false
    path: /etc/systemd/system/docker.service.d/alpn-bridge.conf
    permissions: '0644'
  - content: |
      # Native keepalived, VRRP multicast: identical config on EVERY node,
      # nodes join/leave the VIP election automatically (no peer lists).
      # The VIP follows whoever answers on local port 80 (traefik, host-mode).
      global_defs {
          enable_script_security
          script_user root
      }

      vrrp_script chk_traefik {
          script "/usr/bin/curl -sf -o /dev/null --max-time 2 http://127.0.0.1:80/"
          interval 2
          weight 100
          fall 2
          rise 2
      }

      vrrp_instance VI_1 {
          state BACKUP
          interface eth0
          virtual_router_id 51
          priority 100
          advert_int 1
          virtual_ipaddress {
              10.10.10.200/24
          }
          track_script {
              chk_traefik
          }
      }
    path: /etc/keepalived/keepalived.conf
    permissions: '0644'
  - content: |
      # limit the size of journald or else is 4G
      SystemMaxUse=500M
    path: /etc/systemd/journald.conf
    append: true

# Echo the following message when finished without errors
final_message: "===> cloud-init finished his job at $TIMESTAMP, after $UPTIME seconds"
